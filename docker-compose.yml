services:
  postgres:
    image: postgres:16
    container_name: gridlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridlink}
      POSTGRES_USER: ${POSTGRES_USER:-gridlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridlink_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:5.9.3
    container_name: gridlink-emqx
    restart: unless-stopped
    ports:
      - "${MQTT_PORT_HOST:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"

  api:
    build: ./backend
    container_name: gridlink-api
    restart: unless-stopped
    depends_on:
      - postgres
      - emqx
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gridlink}:${POSTGRES_PASSWORD:-gridlink_dev_password}@postgres:5432/${POSTGRES_DB:-gridlink}
      MQTT_HOST: ${MQTT_HOST:-emqx}
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres_data:
